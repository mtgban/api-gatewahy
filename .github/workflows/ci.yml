name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apiaccess_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Revive
        run: go run github.com/mgechev/revive@v1.13.0 -set_exit_status -config .revive.toml ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Build
        run: go build ./...
      - name: Test
        # DB tests in apiaccess and billing share one scratch database, so packages run one at a time.
        run: go test -race -p 1 ./...
        env:
          APIACCESS_TEST_DSN: postgres://postgres:postgres@localhost:5432/apiaccess_test?sslmode=disable
